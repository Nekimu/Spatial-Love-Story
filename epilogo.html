<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>El Origen 3D · 14 de marzo de 2026 — Unibody</title>
  <meta name="description" content="14 de marzo de 2026 · La imagen que se arma pieza por pieza en el espacio 3D.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/epilogo.css">
  <script>window.PAGINA_ID = 'epilogo';</script>
  <script src="js/datos-yaml.js"></script>
  <script src="js/core.js"></script>
</head>
<body>
  <div class="velo" aria-hidden="true"></div>
  <div class="shell">
    <div class="ambiente" aria-hidden="true"></div>
    <header class="barra gutter" id="barra"></header>
    <script>Unibody.barra();</script>

    <main>
      <section class="ensamble gutter" id="ensamble">
        <div class="relato">
          <div class="apertura" id="apertura"></div>
          <div id="fragmentos"></div>
          <div class="cierre" id="cierre"></div>
        </div>
        <div class="columna-escena" id="columna-escena">
          <div class="escena" role="img" aria-label="La fotografía maestra del 14 de marzo de 2026 dividida en piezas que se acoplan al desplazarte">
            <div class="vaiven">
              <div class="mundo" id="mundo">
                <div class="marco" id="marco">
                  <div class="zocalo"></div>
                  <div id="piezas"></div>
                  <div class="unibody">
                    <div class="kb" id="kb"></div>
                    <div class="destello"></div>
                    <div class="chispas" id="chispas"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="leyenda" aria-hidden="true">
              <span class="leyenda-n" id="leyenda-n">El Origen</span>
              <span class="leyenda-t" id="leyenda-t"></span>
              <span class="leyenda-linea"><i id="leyenda-linea"></i></span>
            </div>
          </div>
        </div>
      </section>

      <section class="puente gutter" id="puente" aria-label="Siguiente capítulo"></section>
    </main>

    <footer class="pie gutter">
      <span>El Origen 3D · 14 de marzo de 2026</span>
      <span>Hecho a mano, recuerdo por recuerdo.</span>
    </footer>
  </div>
  <script src="js/drive-sync.js"></script>
  <script src="js/epilogo.js"></script>
</body>
</html>
