<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>El Mural · Nuestro Álbum — Unibody</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Geist:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/final.css">
  <script>window.PAGINA_ID = 'final';</script>
  <script src="js/datos-yaml.js"></script>
  <script src="js/core.js"></script>
</head>
<body>
  <div class="velo" aria-hidden="true"></div>
  <div class="shell">
    <div class="ambiente" aria-hidden="true"></div>
    <header class="barra gutter" id="barra"></header>
    <script>Unibody.barra();</script>
    <main>
      <div class="gutter"><div class="cabecera" id="cabecera"></div></div>
      <section class="pared gutter" aria-label="Pared de fotografías">
        <div class="mural" id="mural">
          <div class="centro" id="centro"></div>
          <div id="grupos" class="mural"></div>
        </div>
      </section>
      <div class="gutter"><div class="despedida" id="despedida"></div></div>
    </main>
    <footer class="pie gutter">
      <span id="pie-final">El Mural · fecha-date — fecha-date</span>
      <span>Hecho a mano, recuerdo por recuerdo.</span>
    </footer>
  </div>
  <script src="js/drive-sync.js"></script>
  <script src="js/final.js"></script>
</body>
</html>
